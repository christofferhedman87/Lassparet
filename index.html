{title:'3. Aktivt lärande',role:'learner',page:'lesson',step:1,talk:['Välj först ett felaktigt svar för att visa förklarande återkoppling.','Visa att användaren måste försöka igen innan hen fortsätter.','Markera självskattningen efter korrekt svar.']},

function load(){try{const x=JSON.parse(localStorage.getItem('larsparet-poc')||'{}');return {...INITIAL,...x,attempts:{...INITIAL.attempts,...(x.attempts||{})},scores:{...INITIAL.scores,...(x.scores||{})},confidence:{...INITIAL.confidence,...(x.confidence||{})}}}catch{return structuredClone(INITIAL)}}
function save(){try{saveStatus='saving';localStorage.setItem('larsparet-poc',JSON.stringify(progress));saveStatus='saved';announce('Progression sparad lokalt.');setTimeout(()=>syncProgress(false),0);return true}catch(e){saveStatus='error';toast('Det gick inte att spara progressionen i webbläsaren.','error');announce('Sparandet misslyckades.');return false}}
function announce(msg){liveRegion.textContent='';setTimeout(()=>liveRegion.textContent=msg,15)}
function toast(msg,type=''){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;toastRegion.appendChild(el);setTimeout(()=>el.remove(),4200)}
function storageAvailable(){try{const k='__ls_test';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch{return false}}
function clientId(){let id=localStorage.getItem('larsparet-client-id');if(!id){id=crypto.randomUUID?crypto.randomUUID():'poc-'+Date.now()+'-'+Math.random().toString(16).slice(2);localStorage.setItem('larsparet-client-id',id)}return id}
async function apiRequest(method,body){const res=await fetch('/api/progress',{method,headers:{'Content-Type':'application/json','X-Larsparet-Client':clientId()},body:body?JSON.stringify(body):undefined});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);return data}
async function checkBackend(){if(!navigator.onLine){syncState={mode:'pending',message:'Offline – väntar på anslutning',updatedAt:null};render();return}syncState={mode:'checking',message:'Kontrollerar serverlagring',updatedAt:null};render();try{const data=await apiRequest('GET');if(data.progress){progress={...progress,...data.progress,attempts:{...progress.attempts,...(data.progress.attempts||{})},scores:{...progress.scores,...(data.progress.scores||{})},confidence:{...progress.confidence,...(data.progress.confidence||{})}};localStorage.setItem('larsparet-poc',JSON.stringify(progress))}syncState={mode:'server',message:data.progress?'Progression hämtad från Cloudflare D1':'Serverlagring ansluten',updatedAt:data.updatedAt||null};render();announce(syncState.message)}catch(e){syncState={mode:'local',message:'Serverlagring är inte konfigurerad – använder lokal lagring',updatedAt:null,error:e.message};render()}}
async function syncProgress(showToast=true){if(!navigator.onLine){syncState={mode:'pending',message:'Ändringar väntar på synkronisering',updatedAt:null};render();return false}syncState={mode:'checking',message:'Synkroniserar progression',updatedAt:null};render();try{const data=await apiRequest('PUT',{progress,appVersion:'6'});syncState={mode:'server',message:'Progression synkroniserad med Cloudflare D1',updatedAt:data.updatedAt};if(showToast)toast('Progression synkroniserad.');render();return true}catch(e){syncState={mode:'local',message:'Kunde inte nå serverlagringen – lokala data är kvar',updatedAt:null,error:e.message};if(showToast)toast('Serverlagringen kunde inte nås. Progressionen finns kvar lokalt.','error');render();return false}}
function syncPanel(){const icon=syncState.mode==='server'?'✓':syncState.mode==='checking'?'↻':syncState.mode==='pending'?'…':'⌁';const klass=syncState.mode==='pending'?'pending':syncState.mode==='local'?'error':'';return `<section class="sync-card ${klass}" aria-label="Lagringsstatus"><div class="sync-icon" aria-hidden="true">${icon}</div><div><div class="between"><strong>${syncState.message}</strong><span class="server-badge ${syncState.mode==='server'?'':'local'}">${syncState.mode==='server'?'D1':'Lokal reserv'}</span></div><div class="sync-meta">Klient-ID: <span class="code-chip">${clientId().slice(0,8)}…</span>${syncState.updatedAt?` · Senast synkroniserad ${new Date(syncState.updatedAt).toLocaleString('sv-SE')}`:''}</div>${syncState.error?`<div class="sync-meta">Teknisk information: ${esc(syncState.error)}</div>`:''}<div class="sync-actions">${btn('Synkronisera nu','sync','outline')}${btn('Kontrollera anslutning','checkbackend','outline')}</div><div class="privacy-note"><strong>Teknisk PoC:</strong> Servern lagrar ett slumpmässigt klient-ID och PoC-progression. Ingen inloggning eller identifierande personuppgift används.</div></div></section>`}
function saveIndicator(){return `<span class="save-state ${saveStatus}"><span class="save-dot"></span>${saveStatus==='error'?'Sparfel':'Sparat lokalt'}</span>`}
function updateConnection(){const online=navigator.onLine;netbar.classList.toggle('show',!online);connectionChip.classList.toggle('offline',!online);connectionChip.textContent=online?'Online':'Offline';if(!online)announce('Du är offline. Progression sparas lokalt.');else{announce('Anslutningen är återställd.');if(syncState.mode==='pending')setTimeout(()=>syncProgress(false),100)}}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function title(e,t,b=''){return `<div class="eyebrow">${e}</div><h1 class="title">${t}</h1>${b?`<p class="lead">${b}</p>`:''}`}
function btn(text,action,kind='primary',extra=''){return `<button class="btn btn-${kind}" data-action="${action}" ${extra}>${text}</button>`}
function renderNav(){const html=navs[role].map(([id,ic,lab])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${ic}</span>${lab}</button>`).join('');desktopNav.innerHTML=html;mobileNav.innerHTML=html}
function metric(label,value,icon){return `<article class="card metric"><div class="iconbox" aria-hidden="true">${icon}</div><div class="muted">${label}</div><div class="num">${value}</div></article>`}
function start(){const pct=progress.completed?100:Math.round(progress.step/(STEPS.length-1)*100);return `${title('Din lärstart','God morgon','Börja med det viktigaste. Du kan alltid lämna och fortsätta senare.')}<div class="grid hero-grid"><article class="card hero"><div class="card-pad"><span class="pill">▶ Fortsätt där du slutade</span><h2>${COURSE.title}</h2><p class="muted">${COURSE.summary}</p><div style="margin-top:24px"><div class="between" style="font-size:.9rem;margin-bottom:7px"><span>${progress.completed?'Genomförd':`Steg ${progress.step+1} av ${STEPS.length}`}</span><span>${pct} %</span></div><div class="progressline" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="progressbar" style="width:${pct}%"></div></div></div><div style="margin-top:25px">${btn(progress.completed?'Visa kursen':'Fortsätt, cirka 4 minuter','course','light')}</div></div></article><div class="stack"><article class="card soft-violet"><div class="card-pad"><div class="iconbox" style="background:var(--violet);color:#fff">↻</div><h2 style="margin:0">Repetera</h2><p class="muted">En kort fråga hjälper dig att minnas längre.</p>${btn('Repetera nu','repeat','outline')}</div></article><article class="card"><div class="card-pad"><strong>◎ Ditt mål</strong><p class="muted" style="margin-bottom:0">Slutför 1 kurs</p></div></article></div></div>`}
function course(){const moduleData=[['Bedöm situationen',0,1],['Välj första åtgärd',2,3],['Följ upp tydligt',4,7]];return `<button class="plain" data-page="start">← Till start</button>${title('Kursöversikt',COURSE.title,COURSE.summary)}<div class="grid course-grid"><article class="card"><div class="card-pad"><h2>Efter kursen kan du</h2><ul class="clean">${COURSE.objectives.map(x=>`<li><span class="check">✓</span><span>${x}</span></li>`).join('')}</ul><div class="module-list">${moduleData.map(([name,from,to],n)=>{const done=progress.completed||progress.step>to,current=!done&&progress.step>=from&&progress.step<=to;return `<div class="module-row"><div class="module-state ${done?'done':current?'current':''}">${done?'✓':n+1}</div><div><strong>${name}</strong><div class="muted">Lektion ${n+1} · ${to-from+1} steg</div></div><span class="badge">${done?'Klar':current?'Pågår':'Kommande'}</span></div>`}).join('')}</div><div style="margin-top:26px">${btn(progress.step?'Fortsätt kursen →':'Starta kursen →','lesson','primary','style="width:100%"')}</div></div></article><aside class="stack"><article class="card soft-orange"><div class="card-pad"><strong>Omfattning</strong><div style="font-size:2.2rem;font-weight:900">${COURSE.minutes} min</div><p class="muted">3 lektioner, 3 aktiva kontroller, 1 arbetskort och 1 repetition.</p></div></article><article class="card"><div class="card-pad"><strong>Pedagogisk modell</strong><p class="muted">Förstå → återkalla → öva → tillämpa → repetera.</p></div></article></aside></div>`}
function sameSet(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}
function lesson(){const i=Math.min(progress.step,STEPS.length-1),s=STEPS[i],pct=Math.round((i+1)/STEPS.length*100),attempts=progress.attempts[i]||0;let inner=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1>${s.body?`<p>${s.body}</p>`:''}${s.callout?`<div class="callout">${s.callout}</div>`:''}`;
if(['question','scenario','multiple'].includes(s.type)){const multi=s.type==='multiple';inner+=`<p style="font-weight:800">${s.prompt}</p>${multi?'<p class="multi-note">Du kan välja flera alternativ.</p>':''}<fieldset class="answers" ${checked?'disabled':''}><legend class="hidden">${multi?'Välj alla svar som passar':'Välj ett svar'}</legend>${s.options.map((x,n)=>`<label class="answer"><input type="${multi?'checkbox':'radio'}" name="answer" value="${n}" ${multi?(Array.isArray(answer)&&answer.includes(n)?'checked':''):(answer===n?'checked':'')}><span>${x}</span></label>`).join('')}</fieldset>`;const has=multi?Array.isArray(answer)&&answer.length>0:answer!==null;if(!checked)inner+=btn('Kontrollera mitt svar','check','primary',`style="width:100%" ${has?'':'disabled'}`);else{const ok=multi?sameSet(answer,s.correct):answer===s.correct;inner+=`<div class="feedback ${ok?'good':'retry'}" role="status" tabindex="-1" id="feedback"><h3>${ok?'✓ Bra tänkt':'ⓘ Försök en gång till'}</h3><p>${ok?s.correctText:s.incorrectText}</p><p class="muted">${s.why}</p>${ok?`<div class="confidence"><span style="width:100%;font-weight:800">Hur säker känner du dig?</span>${['Osäker','Ganska säker','Säker'].map((x,n)=>`<button class="btn btn-outline" data-confidence="${n+1}" aria-pressed="${progress.confidence[s.objective]===n+1}">${x}</button>`).join('')}</div>`:btn('Försök igen','retry','outline')}<div class="attempt-note">Försök i detta steg: ${attempts}</div></div>`}}
if(s.type==='workcard')inner+=`<div class="workcard">${s.items.map((x,n)=>`<div class="workrow"><span class="stepnum">${n+1}</span><span>${x}</span></div>`).join('')}${btn(progress.bookmarked?'✓ Sparat':'◇ Spara arbetskort','bookmark','light')}</div>`;
if(s.type==='complete')inner+=`<div class="complete"><div class="complete-icon">✓</div><p>${s.body}</p><div class="learning-summary"><div><strong>Tre lärandemål tränade</strong><div class="muted">Resultaten visas separat under Min progression.</div></div><span style="font-size:1.8rem" aria-hidden="true">◎</span></div></div>`;
const tested=['question','scenario','multiple'].includes(s.type),ok=!tested||checked&&((s.type==='multiple'&&sameSet(answer,s.correct))||(s.type!=='multiple'&&answer===s.correct));return `<section class="lesson"><div class="lesson-top"><button class="plain" data-page="course">× Avsluta</button><strong>Steg ${i+1} av ${STEPS.length}</strong>${saveIndicator()}</div><div class="lesson-progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div><article class="card fade"><div class="card-pad">${inner}</div></article><div class="lesson-actions">${btn('← Tillbaka','back','outline',i===0?'disabled':'')}${btn(i===STEPS.length-1?'Gå till repetition →':'Fortsätt →','next','primary',ok?'':'disabled')}</div></section>`}
function repeat(){return `${title('Repetition','Träna för att minnas längre','Försök återkalla svaret innan du jämför med modellen.')}<article class="card lesson"><div class="card-pad"><label for="recall"><strong>Vilken kontroll gör du först när något går fel?</strong></label><textarea id="recall" class="textarea" rows="4" placeholder="Skriv ett kort svar..."></textarea><div id="repeatAction" style="margin-top:14px">${btn('Visa svar och jämför','showmodel','primary','disabled style="width:100%"')}</div></div></article>`}
function profile(){const avg=Math.round(Object.values(progress.scores).reduce((a,b)=>a+b,0)/3);return `${title('Din översikt','Min progression','Aktivitet, lärandemål och repetition visas separat.')}<div class="grid metric-grid">${metric('Kursstatus',progress.completed?'Genomförd':'Pågående','▤')}${metric('Arbetskort',progress.bookmarked?'Sparat':'Inte sparat','◇')}${metric('Repetition',progress.repetitionDone?'Genomförd':'Återstår','↻')}</div><article class="card" style="margin-top:20px"><div class="card-pad"><div class="between"><h2 style="margin:0">Resultat per lärandemål</h2><span class="badge">Samlat ${avg} %</span></div><p class="muted">Resultaten visar genomförda kunskapskontroller, inte arbetsprestation eller formell kompetens.</p><div class="objective-grid">${Object.entries(OBJECTIVES).map(([id,o])=>{const sc=progress.scores[id]||0,cf=progress.confidence[id];return `<div class="objective-card"><strong>${o.title}</strong><div class="objective-score">${sc?sc+' %':'Inte tränat'}</div><div class="mastery"><div style="width:${sc}%"></div></div><div class="attempt-note">Självskattning: ${cf?['','Osäker','Ganska säker','Säker'][cf]:'saknas'}</div></div>`}).join('')}</div></div></article>`}
function manager(){return `${title('Chefsvy, simulerad','Gruppöversikt','Syntetiska data visar hur aktivitet och läranderesultat hålls isär.')}<div class="grid metric-grid">${metric('Tilldelat','28','◉')}${metric('Pågående','7','▤')}${metric('Genomfört','18','✓')}</div><article class="card" style="margin-top:20px"><div class="card-pad"><h2>Lärandemål som kan behöva stöd</h2><div class="soft-orange" style="padding:20px;border-radius:18px"><strong>Välja första åtgärd</strong><div style="font-size:2.3rem;font-weight:900">54 %</div><p class="muted">korrekta svar vid första försöket, baserat på 24 syntetiska genomföranden.</p></div><div class="notice"><strong>Viktigt:</strong> Aktivitet är inte samma sak som visad kompetens. PoC:n visar inga individrankningar.</div></div></article>`}
function admin(builder=false){if(!builder)return `${title('Administration, simulerad','Innehållsöversikt','Vyn demonstrerar det framtida redaktionella arbetsflödet.')}<div class="grid metric-grid">${metric('Väntar på granskning','3','✓')}${metric('Behöver granskningsdatum','2','!')}${metric('Ofullständig språkversion','1','A')}</div>`;return `${title('Administration, simulerad','Kursbyggare','Vyn demonstrerar strukturen och kvalitetskontrollen. Ändringar sparas inte i denna PoC.')}<article class="card"><div class="card-pad admin-grid grid"><div class="panel"><strong>Kursstruktur</strong><p>▾ Agera rätt...</p><p>　✓ Bedöm situationen</p><p style="background:var(--mint);padding:8px;border-radius:9px">　● Välj första åtgärd</p><p>　○ Följ upp</p><p>　○ Repetition</p></div><div><h2>Välj första åtgärd</h2><label><strong>Lärandemål</strong><input class="field" value="Användaren kan välja rätt första åtgärd" readonly></label><div class="toolrow" style="margin-top:18px">${['Text','Bild','Fråga','Scenario'].map(x=>btn('+ '+x,'noop','outline')).join('')}</div><div class="notice"><strong>Kvalitetskontroll</strong><p style="color:var(--ok)">✓ Lärandemål<br>✓ Aktiv övning</p><p style="color:var(--danger)">! Alt-text saknas<br>! Källa saknas</p></div></div></div></article>`}

function learning(){return `${title('Lärande','Kurser','Fortsätt en pågående kurs eller utforska kommande delar av Lärspåret.')}<div class="demo-note"><span aria-hidden="true">ⓘ</span><div><strong>PoC-katalog</strong><div class="muted">Den första kursen är fullt interaktiv. Övriga kort visar den planerade katalogupplevelsen.</div></div></div><div class="course-list"><article class="card course-item"><div class="card-pad"><span class="pill" style="background:var(--mint);color:var(--brand)">Interaktiv PoC</span><h2>${COURSE.title}</h2><p class="muted">${COURSE.summary}</p><div class="tagrow"><span class="tinytag">12 min</span><span class="tinytag">Svenska</span><span class="tinytag">Mikrolärande</span></div>${btn(progress.step?'Fortsätt kursen →':'Starta kursen →','course','primary')}</div></article><article class="card course-item"><div class="card-pad"><span class="pill" style="background:var(--violet-bg);color:var(--violet)">Planerad</span><h2>Introduktion till en ny arbetsplats</h2><p class="muted">Ett exempel på hur introduktion kan delas upp i korta, rollanpassade lärspår.</p><div class="tagrow"><span class="tinytag">25 min</span><span class="tinytag">Flera språk</span></div>${btn('Förhandsvisa upplägg','planned','outline')}</div></article><article class="card course-item"><div class="card-pad"><span class="pill" style="background:var(--orange-bg);color:var(--danger)">Planerad</span><h2>Bemötande i svåra situationer</h2><p class="muted">Scenarioövningar med val, konsekvenser och förklarande återkoppling.</p><div class="tagrow"><span class="tinytag">18 min</span><span class="tinytag">Scenario</span></div>${btn('Förhandsvisa upplägg','planned','outline')}</div></article><article class="card course-item"><div class="card-pad"><span class="pill" style="background:#eef3f0;color:#40524c">Planerad</span><h2>Informationshantering i vardagen</h2><p class="muted">Praktiska exempel, arbetskort och återkommande repetition.</p><div class="tagrow"><span class="tinytag">15 min</span><span class="tinytag">Arbetskort</span></div>${btn('Förhandsvisa upplägg','planned','outline')}</div></article></div>`}
function saved(){if(!progress.bookmarked)return `${title('Sparat','Dina arbetskort','Här samlas det stöd du vill kunna hitta snabbt i arbetet.')}<article class="card"><div class="saved-empty"><div class="iconbox" style="margin:auto">◇</div><h2>Inget sparat ännu</h2><p class="muted">Genomför demonstrationskursen och spara arbetskortet för att se det här.</p>${btn('Öppna kursen →','course','primary')}</div></article>`;return `${title('Sparat','Dina arbetskort','Öppna praktiskt stöd utan att gå igenom hela kursen igen.')}<article class="card"><div class="card-pad"><div class="between"><div><div class="eyebrow">Arbetskort</div><h2 style="margin:0">När något går fel</h2></div><span class="badge">Sparat</span></div><div class="workcard" style="margin-top:18px">${STEPS[3].items.map((x,n)=>`<div class="workrow"><span class="stepnum">${n+1}</span><span>${x}</span></div>`).join('')}</div><div style="margin-top:16px">${btn('Öppna i kursen →','workcard','outline')}</div></div></article>`}
function help(){return `${title('Hjälp och support','Vad behöver du hjälp med?','Välj det alternativ som bäst beskriver ditt behov.')}<div class="grid help-grid"><article class="card"><div class="card-pad help-action"><div class="iconbox">?</div><div><h2 style="margin-top:0">Så fungerar Lärspåret</h2><p class="muted">Lär i korta steg, prova själv, få återkoppling och repetera senare.</p>${btn('Visa introduktion','intro','outline')}</div></div></article><article class="card"><div class="card-pad help-action"><div class="iconbox">⚙</div><div><h2 style="margin-top:0">Tekniskt problem</h2><p class="muted">I PoC:n kan du återställa demonstrationsdata om något har fastnat.</p>${btn('Återställ PoC','reset','outline')}</div></div></article><article class="card"><div class="card-pad help-action"><div class="iconbox">!</div><div><h2 style="margin-top:0">Fel i innehållet</h2><p class="muted">I den tekniska PoC:n kopplas denna funktion till ett ärendeflöde.</p>${btn('Visa tänkt flöde','planned','outline')}</div></div></article><article class="card"><div class="card-pad help-action"><div class="iconbox">A</div><div><h2 style="margin-top:0">Tillgänglighet</h2><p class="muted">PoC:n stödjer tangentbord, tydlig fokusmarkering, minskad rörelse och responsiv layout.</p>${btn('Läs PoC-information','info','outline')}</div></div></article></div>`}
function presentationPanel(item){return `<aside class="speaker-card" aria-label="Talarstöd"><h3>Talarstöd</h3><ul>${item.talk.map(x=>`<li>${x}</li>`).join('')}</ul><div class="anchor-note"><strong>Hållpunkt:</strong> ${item.title}</div></aside>`}
function renderPresentBar(){if(!presentation){presentBar.classList.remove('show');presentBar.innerHTML='';return}const item=PRESENTATION[presentIndex];presentBar.classList.add('show');presentBar.innerHTML=`<div class="present-inner"><div><div class="present-step">Steg ${presentIndex+1} av ${PRESENTATION.length}</div><div class="present-title">${item.title}</div></div><div class="present-actions">${btn('← Föregående','presentprev','outline',presentIndex===0?'disabled':'')}${btn(presentIndex===PRESENTATION.length-1?'Avsluta':'Nästa →',presentIndex===PRESENTATION.length-1?'presentend':'presentnext','light')}</div></div>`}
function applyPresentationStep(){const item=PRESENTATION[presentIndex];role=item.role;document.querySelector('#role').value=role;page=item.page;if(Number.isInteger(item.step)){progress.step=item.step;answer=null;checked=false}render();document.querySelector('.main')?.insertAdjacentHTML('afterbegin',presentationPanel(item));document.querySelector('.card,.decision-card')?.classList.add('demo-highlight');renderPresentBar();main.focus();announce(item.title)}
function startPresentation(){presentation=true;presentIndex=0;document.body.classList.add('presentation-mode');applyPresentationStep()}
function endPresentation(){presentation=false;document.body.classList.remove('presentation-mode');presentBar.classList.remove('show');role='learner';document.querySelector('#role').value=role;page='start';render();main.focus();announce('Presentationsläget avslutat.')}
function decisionText(){return `LÄRSPÅRET – FÖRSLAG TILL BESLUT\n\nGodkänn att Lärspåret går vidare till en teknisk PoC i avgränsad testmiljö.\n\nTeknisk PoC ska verifiera:\n- Microsoft Entra ID för testanvändare\n- Microsoft Dataverse för kurs, version och progression\n- säkrat API mellan deltagargränssnitt och Dataverse\n- modelldriven Power App för innehållsadministration\n- enkelt gransknings- och publiceringsflöde\n- schemalagd repetition och teknisk loggning\n\nEfterfrågade resurser:\n- godkänd utvecklingsmiljö\n- teknisk kontakt för Azure\n- teknisk kontakt för Power Platform\n- tillgång till Dataverse i test\n- möjlighet till appregistrering\n- 3–5 verksamhetsrepresentanter för validering\n\nPoC:n använder endast syntetiska data och är inte ett produktionssystem.`}
function businessCase(){return `${title('Förankringsstöd','Beslutsunderlag för teknisk PoC','Sammanfattningen skiljer på vad som redan är demonstrerat och vad nästa tekniska steg behöver bevisa.')}<div class="evidence-grid"><article class="evidence"><strong>Demonstrerat</strong><span class="muted">Mobil lärresa, tre lärandemål, återkoppling, arbetskort, repetition och lokal progression.</span></article><article class="evidence"><strong>Simulerat</strong><span class="muted">Inloggning, gruppdata, kursbyggarens sparande, notifieringar och integrationer.</span></article><article class="evidence"><strong>Nästa bevis</strong><span class="muted">Entra ID, Dataverse, säkrat API, redaktionell Power App och verklig testlagring.</span></article></div><div class="grid course-grid" style="margin-top:20px"><article class="decision-card"><div class="eyebrow" style="color:#9ed9ca">Rekommenderat beslut</div><h2>Godkänn en avgränsad teknisk PoC</h2><p class="muted">Målet är att verifiera identitet, datamodell, administration, progression och repetitionsmotor utan att öppna för bred produktion.</p>${btn('Kopiera beslutsförslag','copydecision','light')}</article><article class="card"><div class="card-pad"><h2>Efterfrågade resurser</h2><div class="roadmap">${['Testmiljö och Dataverse','Azure- och Power Platform-kontakter','Appregistrering för test','3–5 verksamhetsrepresentanter'].map((x,n)=>`<div class="roadmap-row"><span class="roadmap-num">${n+1}</span><strong>${x}</strong></div>`).join('')}</div></div></article></div><article class="card" style="margin-top:20px"><div class="card-pad"><h2>Kopierbar sammanfattning</h2><textarea id="decisionText" class="copybox" readonly>${decisionText()}</textarea><div style="margin-top:12px">${btn('Kopiera text','copydecision','outline')}</div></div></article>`}
function storagePage(){return `${title('Teknisk PoC','Verklig lagring','Den här versionen använder ett riktigt API och Cloudflare D1 när databasbindningen DB är konfigurerad. Lokal lagring fungerar som reserv.')} ${syncPanel()}<div class="technical-grid"><article class="evidence"><strong>Frontend</strong><span class="muted">Samma tillgängliga webbapp. Progression sparas först lokalt och synkroniseras sedan till <span class="code-chip">/api/progress</span>.</span></article><article class="evidence"><strong>Pages Function</strong><span class="muted">Validerar klient-ID, metod och JSON-storlek innan data skrivs.</span></article><article class="evidence"><strong>D1-databas</strong><span class="muted">Tabellen <span class="code-chip">poc_progress</span> lagrar ett slumpmässigt klient-ID, versionsnummer, JSON och tidstämpel.</span></article><article class="evidence"><strong>Reservläge</strong><span class="muted">Om API eller D1 saknas fortsätter appen med lokal lagring och visar tydlig status.</span></article></div><article class="card" style="margin-top:20px"><div class="card-pad"><h2>Gränssnitt som är implementerade</h2><ul><li><span class="code-chip">GET /api/progress</span> hämtar klientens progression.</li><li><span class="code-chip">PUT /api/progress</span> validerar och sparar progression.</li><li><span class="code-chip">DELETE /api/progress</span> raderar klientens serverpost.</li></ul><p class="muted">Detta är verklig pseudonym PoC-lagring, inte den beslutade målarkitekturen med Entra ID och Dataverse.</p>${btn('Radera serverdata','deleteserver','outline')}</div></article>`}
function diagnostics(){const tests=[['Lokal lagring',storageAvailable(),'Progression kan sparas i den här webbläsaren.'],['Nätanslutning',navigator.onLine,'Appen fungerar med lokalt sparad progression även vid kortare avbrott.'],['Viewport',window.innerWidth>=320,`Aktuell bredd: ${window.innerWidth} px.`],['Minskat rörelseläge',matchMedia('(prefers-reduced-motion: reduce)').matches,'Användarens systeminställning avläses.'],['Mörkt läge',document.body.dataset.theme==='dark','Kan växlas med knappen i sidhuvudet.'],['Kursdata',STEPS.length===8,`${STEPS.length} kurssteg laddade.`]];return `${title('Teknisk kontroll','Självdiagnostik','Kontrollen visar PoC:ns aktuella klientmiljö. Den ersätter inte professionell tillgänglighets- eller säkerhetsgranskning.')}<div class="diagnostic-grid">${tests.map(([name,ok,note])=>`<article class="diagnostic"><div class="diagnostic-head"><strong>${name}</strong><span class="${ok?'pass':'warn'}">${ok?'Godkänd':'Kontrollera'}</span></div><p class="muted">${note}</p></article>`).join('')}</div><article class="card" style="margin-top:20px"><div class="card-pad"><h2>Manuella kontroller som återstår</h2><ul><li>Fullständigt tangentbordstest i aktuell Edge och Chrome.</li><li>NVDA-test i Windows och VoiceOver-test i Safari.</li><li>Förstoring till 200 procent och reflow vid 320 CSS-pixlar.</li><li>Granskning av färgkontrast i både ljust och mörkt läge.</li><li>Test på faktisk iPhone och Android-enhet.</li></ul>${btn('Kör om självdiagnostik','diagnostics','outline')}</div></article>`}
function generic(name){return `${title('Förankrings-PoC',name,'Den här delen visar den planerade informationsarkitekturen. Kärnflödet finns under Start.')}<article class="card"><div class="card-pad" style="text-align:center;padding-block:55px"><div class="iconbox" style="margin:auto">▤</div><h2>Avgränsad i PoC</h2><p class="muted">Funktionen är förenklad för att låta kärnresan, pedagogiken och mobilupplevelsen stå i centrum.</p></div></article>`}
function render(){renderNav();let html=page==='start'?start():page==='course'?course():page==='lesson'?lesson():page==='repeat'?repeat():page==='profile'?profile():page==='manager'?manager():page==='admin'?admin():page==='builder'?admin(true):page==='learning'?learning():page==='saved'?saved():page==='help'?help():page==='diagnostics'?diagnostics():page==='storage'?storagePage():page==='case'?businessCase():generic('Lärspåret');if(!presentation&&page==='start')html=syncPanel()+html;if(presentation)html=presentationPanel(PRESENTATION[presentIndex])+html;main.innerHTML=`<div class="fade">${html}<div class="reset"><button class="linkbtn muted" data-action="reset">Återställ demonstrationsdata</button></div></div>`;if(page==='lesson'&&checked)setTimeout(()=>document.querySelector('#feedback')?.focus({preventScroll:true}),0);renderPresentBar();if(page==='repeat'){const ta=document.querySelector('#recall');ta?.addEventListener('input',()=>{document.querySelector('[data-action="showmodel"]').disabled=!ta.value.trim()})}}
function openInfo(){modalRoot.innerHTML=`<div class="modalback" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="between"><div><div class="eyebrow">PoC-information</div><h2 id="modalTitle" style="margin:0">Vad är verkligt här?</h2></div><button class="plain" data-action="close" aria-label="Stäng">✕</button></div><p><strong>Implementerat i v6:</strong> Pages Function-API, Cloudflare D1-lagring, synkstatus och lokal reservlagring. Tidigare funktioner: guidat presentationsläge, talarstöd, beslutsunderlag och kopierbar sammanfattning. Tidigare funktioner: robust lokal lagring, offlineindikering, återställningsdialog, fokushantering, mörkt läge och självdiagnostik. Tidigare funktioner: tre lektioner, tre lärandemål, individuell resultatspårning, självskattning, flersvarsfråga, responsiv deltagarresa, lokal progression, frågor, återkoppling, scenario, arbetskort, repetition, rollväxling och demonstrationsvyer.</p><p><strong>Simulerat:</strong> inloggning, chefens gruppdata, kursbyggarens sparande, Dataverse, notifieringar och integrationer.</p><p><strong>Syfte:</strong> validera produktidé, pedagogik och användbarhet före teknisk integration.</p>${btn('Jag förstår','close','primary','style="width:100%"')}</div></div>`;document.querySelector('.modal button')?.focus()}
function closeModal(){modalRoot.innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus();lastFocus=null}
function openConfirmReset(){lastFocus=document.activeElement;modalRoot.innerHTML=`<div class="modalback" role="dialog" aria-modal="true" aria-labelledby="resetTitle"><div class="modal"><div class="eyebrow">Bekräfta återställning</div><h2 id="resetTitle">Radera all lokal demonstrationsdata?</h2><p>Progression, resultat, självskattningar och sparat arbetskort återställs. Åtgärden påverkar bara den här webbläsaren.</p><div class="confirm-actions">${btn('Avbryt','close','outline')}${btn('Återställ data','confirmreset','primary')}</div></div></div>`;document.querySelector('.modal button')?.focus()}
function openDeleteServer(){lastFocus=document.activeElement;modalRoot.innerHTML=`<div class="modalback" role="dialog" aria-modal="true" aria-labelledby="deleteServerTitle"><div class="modal"><div class="eyebrow">Serverlagring</div><h2 id="deleteServerTitle">Radera progression från D1?</h2><p>Den lokala progressionen påverkas inte. Nästa synkronisering kan skapa serverposten igen.</p><div class="confirm-actions">${btn('Avbryt','close','outline')}${btn('Radera serverdata','confirmdeleteserver','primary')}</div></div></div>`;document.querySelector('.modal button')?.focus()}
function trapModal(e){const modal=document.querySelector('.modal');if(!modal||e.key!=='Tab')return;const nodes=[...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Beslutsförslaget har kopierats.')}catch{toast('Kopieringen misslyckades. Markera texten manuellt.','error')}ta.remove()}
function handle(action){const i=Math.min(progress.step,STEPS.length-1);if(action==='info'){lastFocus=document.activeElement;openInfo()}if(action==='close')closeModal();if(action==='course'){page='course';render()}if(action==='repeat'){page='repeat';render()}if(action==='check'){const st=STEPS[Math.min(progress.step,STEPS.length-1)];progress.attempts[progress.step]=(progress.attempts[progress.step]||0)+1;const ok=st.type==='multiple'?sameSet(answer||[],st.correct):answer===st.correct;if(ok)progress.scores[st.objective]=100;save();checked=true;render()}if(action==='retry'){answer=null;checked=false;render()}if(action==='bookmark'){progress.bookmarked=true;save();render()}if(action==='workcard'){progress.step=3;page='lesson';save();render()}if(action==='intro'){role='learner';document.querySelector('#role').value='learner';page='start';openInfo()}if(action==='planned'){lastFocus=document.activeElement;modalRoot.innerHTML=`<div class="modalback" role="dialog" aria-modal="true" aria-labelledby="plannedTitle"><div class="modal"><div class="between"><div><div class="eyebrow">Planerad funktion</div><h2 id="plannedTitle" style="margin:0">Ingår i nästa tekniska steg</h2></div><button class="plain" data-action="close" aria-label="Stäng">✕</button></div><p>Denna del visar produktens avsedda riktning men är inte implementerad i förankrings-PoC:n.</p>${btn('Stäng','close','primary','style="width:100%"')}</div></div>`;document.querySelector('.modal button')?.focus()}if(action==='back'&&i>0){progress.step--;answer=null;checked=false;save();render()}if(action==='next'){if(i===STEPS.length-1){progress.completed=true;page='repeat'}else{progress.step++;answer=null;checked=false}save();render()}if(action==='showmodel'){const value=document.querySelector('#recall').value;document.querySelector('#repeatAction').innerHTML=`<div class="feedback good"><h3>Modellsvar</h3><p>Kontrollera först om någon eller något är i omedelbar risk. Agera akut om det behövs och använd därefter fastställd kontaktväg.</p><p class="muted"><strong>Ditt svar:</strong> ${esc(value)}</p>${btn('Mitt svar täckte kärnan','repeatdone','primary')} ${btn('Försök igen','repeatreset','outline')}</div>`}if(action==='repeatdone'){progress.repetitionDone=true;save();page='profile';render()}if(action==='repeatreset'){render()}if(action==='reset'){openConfirmReset()}if(action==='confirmreset'){progress=structuredClone(INITIAL);save();page='start';answer=null;checked=false;closeModal();render();toast('Demonstrationsdata har återställts.')}if(action==='diagnostics'){page='diagnostics';render()}if(action==='theme'){const dark=document.body.dataset.theme!=='dark';document.body.dataset.theme=dark?'dark':'light';localStorage.setItem('larsparet-theme',dark?'dark':'light');themeButton.setAttribute('aria-label',dark?'Byt till ljust läge':'Byt till mörkt läge');announce(dark?'Mörkt läge aktiverat.':'Ljust läge aktiverat.')} if(action==='presentation')startPresentation();if(action==='presentnext'){presentIndex=Math.min(PRESENTATION.length-1,presentIndex+1);applyPresentationStep()}if(action==='presentprev'){presentIndex=Math.max(0,presentIndex-1);applyPresentationStep()}if(action==='presentend')endPresentation();if(action==='copydecision'){const text=decisionText();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('Beslutsförslaget har kopierats.')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}if(action==='sync')syncProgress();if(action==='checkbackend')checkBackend();if(action==='deleteserver'){openDeleteServer()}if(action==='confirmdeleteserver'){apiRequest('DELETE').then(()=>{closeModal();syncState={mode:'server',message:'Serverdata raderad',updatedAt:null};toast('Serverdata har raderats.');render()}).catch(e=>toast('Serverdata kunde inte raderas: '+e.message,'error'))} }
document.addEventListener('click',e=>{const c=e.target.closest('[data-confidence]');if(c){const st=STEPS[Math.min(progress.step,STEPS.length-1)];progress.confidence[st.objective]=Number(c.dataset.confidence);save();render()}const p=e.target.closest('[data-page]');if(p){page=p.dataset.page;answer=null;checked=false;render();main.focus();announce('Sida ändrad.')}const a=e.target.closest('[data-action]');if(a)handle(a.dataset.action)});document.addEventListener('change',e=>{if(e.target.name==='answer'){const st=STEPS[Math.min(progress.step,STEPS.length-1)];const v=Number(e.target.value);if(st.type==='multiple'){const a=Array.isArray(answer)?[...answer]:[];answer=e.target.checked?[...new Set([...a,v])]:a.filter(x=>x!==v)}else answer=v;render()}if(e.target.id==='role'){if(presentation)endPresentation();role=e.target.value;page=role==='learner'?'start':role==='manager'?'manager':'admin';render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalRoot.innerHTML)closeModal();trapModal(e)});window.addEventListener('online',updateConnection);window.addEventListener('offline',updateConnection);document.body.dataset.theme=localStorage.getItem('larsparet-theme')||'light';themeButton.setAttribute('aria-label',document.body.dataset.theme==='dark'?'Byt till ljust läge':'Byt till mörkt läge');updateConnection();render();setTimeout(checkBackend,250);
</script>
